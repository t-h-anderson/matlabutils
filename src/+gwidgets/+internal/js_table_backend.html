<!DOCTYPE html>
<html>
<head>
  <style>
    :root {
      color-scheme: light;
      font: 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --table-bg: #fff;
      --table-text: #222;
      --table-border: #d6d6d6;
      --header-bg: #f5f5f5;
      --selected-bg: #d9ecff;
      --selected-outline: #6aa7e8;
      --editable-bg: #fffdf2;
      --menu-bg: #fff;
      --menu-text: #222;
      --menu-border: #b8b8b8;
      --menu-hover-bg: #e7f1ff;
      --menu-disabled-text: #9a9a9a;
      --menu-shadow: rgba(0, 0, 0, 0.18);
      --submenu-border: #e1e1e1;
    }

    body[data-theme="dark"] {
      color-scheme: dark;
      --table-bg: #212121;
      --table-text: #f1f1f1;
      --table-border: #555;
      --header-bg: #2f2f2f;
      --selected-bg: #174a73;
      --selected-outline: #5b9bd5;
      --editable-bg: #2e2a1f;
      --menu-bg: #2b2b2b;
      --menu-text: #f1f1f1;
      --menu-border: #666;
      --menu-hover-bg: #3f5872;
      --menu-disabled-text: #8b8b8b;
      --menu-shadow: rgba(0, 0, 0, 0.45);
      --submenu-border: #555;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    .table-wrap {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: auto;
      background: var(--table-bg);
      color: var(--table-text);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th,
    td {
      min-width: 24px;
      height: 24px;
      padding: 2px 6px;
      border: 1px solid var(--table-border);
      box-sizing: border-box;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      vertical-align: middle;
      user-select: none;
      -webkit-user-select: none;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--header-bg);
      color: var(--table-text);
      font-weight: 600;
      text-align: left;
    }

    .header-content {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
    }

    .header-label {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-menu-button {
      flex: 0 0 auto;
      width: 18px;
      height: 18px;
      padding: 0;
      border: 1px solid transparent;
      background: transparent;
      color: var(--table-text);
      font: inherit;
      line-height: 16px;
      cursor: default;
    }

    .header-menu-button:hover {
      border-color: var(--table-border);
      background: var(--menu-hover-bg);
    }

    .row-header-content {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
    }

    .row-header-label {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row-sort-button {
      flex: 0 0 auto;
    }

    .column-resize-handle {
      position: absolute;
      top: 0;
      right: -3px;
      z-index: 2;
      width: 6px;
      height: 100%;
      cursor: col-resize;
      user-select: none;
      -webkit-user-select: none;
    }

    td.selected,
    tr.selected-row td,
    th.selected-column,
    td.selected-column {
      background: var(--selected-bg);
      outline: 1px solid var(--selected-outline);
      outline-offset: -1px;
    }

    td[contenteditable="true"] {
      background: var(--editable-bg);
    }

    td.group-header-cell {
      cursor: pointer;
      font-weight: 600;
    }

    .context-menu {
      position: fixed;
      z-index: 10000;
      min-width: 160px;
      max-width: 320px;
      display: none;
      padding: 4px 0;
      border: 1px solid var(--menu-border);
      background: var(--menu-bg);
      box-shadow: 0 4px 14px var(--menu-shadow);
      color: var(--menu-text);
    }

    .context-menu ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .context-menu li {
      position: relative;
      z-index: 0;
      padding: 4px 12px;
      background: var(--menu-bg);
      cursor: default;
      white-space: nowrap;
    }

    .context-menu li[data-enabled="true"][data-action]:hover {
      background: var(--menu-hover-bg);
    }

    .context-menu li[data-enabled="false"] {
      color: var(--menu-disabled-text);
    }

    .context-menu li ul {
      position: absolute;
      z-index: 10001;
      top: -5px;
      left: 100%;
      min-width: 160px;
      display: none;
      padding: 4px 0;
      border: 1px solid var(--menu-border);
      background: var(--menu-bg);
      box-shadow: 0 4px 14px var(--menu-shadow);
      color: var(--menu-text);
    }

    .context-menu li.open > ul,
    .context-menu li:hover > ul {
      display: block;
    }

    .context-menu li.open,
    .context-menu li:hover {
      z-index: 10002;
    }

    .context-menu-label {
      position: relative;
      z-index: 1;
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .context-menu li.has-children {
      padding-right: 24px;
    }

    .context-menu li.has-children::after {
      position: absolute;
      top: 50%;
      right: 8px;
      transform: translateY(-50%);
      content: ">";
      pointer-events: none;
    }

    tr.virtual-spacer td {
      height: 0;
      padding: 0;
      border: 0;
      line-height: 0;
    }

    td.group-header-column-cell {
      cursor: default;
    }

    .gwidgets-group-column-span {
      position: absolute;
      z-index: 3;
      display: block;
      box-sizing: border-box;
      overflow: hidden;
      white-space: nowrap;
      cursor: default;
    }

    .gwidgets-group-column-label {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) rotate(-90deg);
      transform-origin: center;
      overflow: hidden;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
      pointer-events: none;
    }
  </style>
  <script>
  var ROW_HEIGHT_PX = 24;
  var HEADER_HEIGHT_PX = 24;
  var ROW_OVERSCAN = 12;
  var htmlComponent = null;
  var state = {
    columns: [],
    values: [],
    stateRevision: 0,
    rowCount: 0,
    cellRows: [],
    cellCols: [],
    cellValues: [],
    cellLayout: "",
    selectionType: "cell",
    multiselect: "on",
    selection: [],
    columnEditable: [],
    columnSortable: [],
    displayOrientation: "Normal",
    rowSortVariables: [],
    rowSortable: [],
    sortByColumn: [],
    sortDirection: "None",
    columnWidth: [],
    columnWidthType: [],
    columnPixelWidth: [],
    columnMinWidth: [],
    columnMaxWidth: [],
    tableMinWidth: null,
    tableMaxWidth: null,
    groupHeaderRows: [],
    groupHeaderLevels: [],
    groupHeaderColumns: [],
    groupHeaderColumnLevels: [],
    tooltip: "",
    hasCustomTooltip: false,
    showGroupHeaderTooltips: true,
    contextMenu: [],
    dragEnabled: false,
    dragMoveKey: "alt",
    dragCopyKey: "control",
    theme: "light",
    styles: []
  };
  var lastClientX = 0;
  var lastClientY = 0;
  var tooltipEl = null;
  var pendingTooltipProbe = null;
  var contextMenuEl = null;
  var contextMenuRow = 0;
  var contextMenuCol = 0;
  var dragSelect = null;
  var resizeDrag = null;
  var columnLayoutOverride = null;
  var columnLayoutOverrideSourceCol = 0;
  var rowDrag = null;
  var rootResizeObserver = null;
  var rootResizeFallbackAttached = false;
  var rootScrollAttached = false;
  var pendingLayoutFrame = 0;
  var pendingBodyFrame = 0;
  var pendingScrollRow = 0;
  var renderScrollTopOverride = null;
  var lastBodyScrollTop = 0;
  var suppressNextClickSelection = false;
  var handledProbeIds = {};
  var pendingInteractionProbe = null;
  var normalisedRowsCache = null;
  var coordinateLookupCache = null;

  function asArray(value) {
    if (!value) return [];
    if (!Array.isArray(value)) return [value];
    return value;
  }

  function flatten(value) {
    var result = [];
    asArray(value).forEach(function(item) {
      if (Array.isArray(item)) {
        result = result.concat(flatten(item));
      } else if (item !== undefined && item !== null && item !== "") {
        result.push(item);
      }
    });
    return result;
  }

  function normaliseTableRows(value) {
    if (!value || !Array.isArray(value) || value.length === 0) return [];
    if (Array.isArray(value[0])) return value;
    return [value];
  }

  function send(data) {
    if (htmlComponent) htmlComponent.Data = data;
  }

  function sendProbeResult(request, extra) {
    var result = Object.assign({
      event: "ProbeResult",
      id: Number(request.id || -1),
      probe: String(request.probe || "")
    }, extra || {});
    send(result);
  }

  function render(payload) {
    state = Object.assign(state, payload || {});
    clearColumnLayoutOverrideForPayload(payload || {});
    resetDataCaches();
    applyTheme(state.theme);
    var root = document.getElementById("root");
    setupRootResizeHandling(root);
    root.tabIndex = 0;
    var desiredScrollTop = pendingScrollRow > 0 ? rowScrollTop(pendingScrollRow) : root.scrollTop || 0;
    root.textContent = "";

    var table = document.createElement("table");
    table.title = nativeTooltipText("");
    renderColgroup(table);
    renderHeader(table);
    renderScrollTopOverride = desiredScrollTop;
    renderBody(table);
    renderScrollTopOverride = null;
    root.appendChild(table);
    root.scrollTop = desiredScrollTop;
    lastBodyScrollTop = root.scrollTop || 0;
    if (Math.abs((root.scrollTop || 0) - desiredScrollTop) > 1 || pendingScrollRow > 0) {
      renderBodyWindow();
    }
    applyColumnLayout(table);
    renderGroupColumnOverlays(table);
    sendRenderComplete();
    sendPendingInteractionProbeResult();
  }

  function sendRenderComplete() {
    send({
      event: "RenderComplete",
      stateRevision: Number(state.stateRevision || 0),
      rowCount: totalRowCount(),
      columnCount: (state.columns || []).length,
      renderedRowCount: document.querySelectorAll("#root tbody tr[data-rendered-row]").length
    });
  }

  function sendPendingInteractionProbeResult() {
    if (!pendingInteractionProbe) return;

    var request = pendingInteractionProbe;
    pendingInteractionProbe = null;
    setTimeout(function() {
      try {
        sendProbeResult(request, snapshot());
      } catch (err) {
        sendProbeResult(request, { error: String(err && err.message ? err.message : err) });
      }
    }, 25);
  }

  function setupRootResizeHandling(root) {
    if (!root) return;
    if (!rootScrollAttached) {
      root.addEventListener("scroll", handleRootScroll, true);
      rootScrollAttached = true;
    }
    if (rootResizeObserver || rootResizeFallbackAttached) return;
    if (typeof ResizeObserver === "function") {
      rootResizeObserver = new ResizeObserver(function() {
        scheduleColumnLayout();
        scheduleBodyRender();
      });
      rootResizeObserver.observe(root);
      return;
    }

    window.addEventListener("resize", scheduleColumnLayout, true);
    rootResizeFallbackAttached = true;
  }

  function handleRootScroll(event) {
    var root = event && event.currentTarget ? event.currentTarget : document.getElementById("root");
    var scrollTop = root ? root.scrollTop || 0 : 0;
    if (pendingScrollRow <= 0 && Math.abs(scrollTop - lastBodyScrollTop) < 1) return;

    scheduleBodyRender();
  }

  function handleClipboardCopy(event) {
    if (isEditingText(event.target)) return;

    var text = selectionClipboardText();
    if (!text) return;

    if (event.clipboardData) {
      event.clipboardData.setData("text/plain", text);
      event.preventDefault();
    }
  }

  function handleClipboardPaste(event) {
    if (isEditingText(event.target)) return;
    if (!event.clipboardData) return;

    var text = event.clipboardData.getData("text/plain");
    if (!text) return;

    event.preventDefault();
    pasteClipboardText(text);
  }

  function handleClipboardKeyDown(event) {
    if (isEditingText(event.target) || !(event.ctrlKey || event.metaKey)) return;

    var key = String(event.key || "").toLowerCase();
    if (key === "c" && navigator.clipboard && navigator.clipboard.writeText) {
      var copyText = selectionClipboardText();
      if (!copyText) return;
      event.preventDefault();
      navigator.clipboard.writeText(copyText);
    } else if (key === "v" && navigator.clipboard && navigator.clipboard.readText) {
      event.preventDefault();
      navigator.clipboard.readText().then(function(text) {
        pasteClipboardText(text || "");
      });
    }
  }

  function isEditingText(target) {
    if (!target) return false;
    if (target.isContentEditable) return true;
    var tag = String(target.tagName || "").toLowerCase();
    return tag === "input" || tag === "textarea";
  }

  function selectionClipboardText() {
    return cellsToTabText(selectedClipboardCells());
  }

  function selectedClipboardCells() {
    var cells = [];
    var nCols = (state.columns || []).length;
    var rows;
    var cols;
    var i;
    var j;

    switch (String(state.selectionType || "cell")) {
      case "row":
        rows = selectionValuesForType("row");
        for (i = 0; i < rows.length; i++) {
          if (isGroupHeaderRow(rows[i])) continue;
          for (j = 1; j <= nCols; j++) cells.push([rows[i], j]);
        }
        break;
      case "column":
        cols = selectionValuesForType("column");
        for (i = 1; i <= totalRowCount(); i++) {
          if (isGroupHeaderRow(i)) continue;
          for (j = 0; j < cols.length; j++) cells.push([i, cols[j]]);
        }
        break;
      default:
        cellSelectionPairs().forEach(function(pair) {
          if (!isGroupHeaderRow(pair[0])) cells.push([Number(pair[0]), Number(pair[1])]);
        });
        break;
    }

    return cells;
  }

  function cellsToTabText(cells) {
    if (!cells || cells.length === 0) return "";

    var rows = uniqueNumbers(cells.map(function(pair) { return Number(pair[0]); })).sort(numberSort);
    var cols = uniqueNumbers(cells.map(function(pair) { return Number(pair[1]); })).sort(numberSort);
    var selected = {};
    cells.forEach(function(pair) {
      selected[pairKey(pair)] = true;
    });

    return rows.map(function(row) {
      return cols.map(function(col) {
        return selected[String(row) + ":" + String(col)] ? String(cellValueAt(row, col) || "") : "";
      }).join("\t");
    }).join("\n");
  }

  function pasteClipboardText(text) {
    var matrix = parseClipboardText(text);
    if (matrix.length === 0) return;

    var anchor = pasteAnchor();
    var rows = [];
    var cols = [];
    var values = [];
    for (var iRow = 0; iRow < matrix.length; iRow++) {
      for (var iCol = 0; iCol < matrix[iRow].length; iCol++) {
        var row = anchor.row + iRow;
        var col = anchor.col + iCol;
        if (!canPasteCell(row, col)) continue;

        rows.push(row);
        cols.push(col);
        values.push(matrix[iRow][iCol]);
      }
    }

    if (rows.length === 0) return;
    send({ event: "CellsPasted", rows: rows, cols: cols, values: values });
  }

  function parseClipboardText(text) {
    text = String(text || "").replace(/\r\n/g, "\n").replace(/\r/g, "\n");
    if (text.endsWith("\n")) text = text.slice(0, -1);
    if (text.length === 0) return [];
    return text.split("\n").map(function(row) {
      return row.split("\t");
    });
  }

  function pasteAnchor() {
    var cells = cellSelectionPairs();
    if (String(state.selectionType || "cell") === "row") {
      var rows = selectionValuesForType("row");
      return { row: rows.length ? Math.min.apply(null, rows) : 1, col: 1 };
    }
    if (String(state.selectionType || "cell") === "column") {
      var cols = selectionValuesForType("column");
      return { row: 1, col: cols.length ? Math.min.apply(null, cols) : 1 };
    }
    if (cells.length === 0) return { row: 1, col: 1 };

    return {
      row: Math.min.apply(null, cells.map(function(pair) { return Number(pair[0]); })),
      col: Math.min.apply(null, cells.map(function(pair) { return Number(pair[1]); }))
    };
  }

  function canPasteCell(row, col) {
    return row >= 1 && col >= 1 && row <= totalRowCount() && col <= (state.columns || []).length &&
      !isGroupHeaderRow(row) && indexedBoolean(state.columnEditable, col - 1);
  }

  function numberSort(a, b) {
    return a - b;
  }

  function scheduleColumnLayout() {
    if (pendingLayoutFrame) return;
    pendingLayoutFrame = window.requestAnimationFrame(function() {
      pendingLayoutFrame = 0;
      if (resizeDrag) return;
      var table = document.querySelector("#root table");
      if (table) {
        applyColumnLayout(table);
        renderGroupColumnOverlays(table);
      }
    });
  }

  function scheduleBodyRender() {
    if (pendingBodyFrame) return;
    pendingBodyFrame = window.requestAnimationFrame(function() {
      pendingBodyFrame = 0;
      renderBodyWindow();
    });
  }

  function renderBodyWindow() {
    var table = document.querySelector("#root table");
    if (!table) return;
    var root = document.getElementById("root");
    var desiredScrollTop = pendingScrollRow > 0 ? rowScrollTop(pendingScrollRow) : root.scrollTop || 0;
    var tbody = table.querySelector("tbody");
    if (tbody) table.removeChild(tbody);
    renderBody(table);
    if (root) {
      root.scrollTop = desiredScrollTop;
      lastBodyScrollTop = root.scrollTop || 0;
    }
    renderGroupColumnOverlays(table);
  }

  function applyTheme(theme) {
    var normalised = String(theme || "light").toLowerCase();
    if (normalised !== "dark") normalised = "light";
    document.body.dataset.theme = normalised;
  }

  function renderColgroup(table) {
    var nColumns = (state.columns || []).length;
    if (nColumns === 0) return;
    var colgroup = document.createElement("colgroup");
    for (var i = 0; i < nColumns; i++) {
      var col = document.createElement("col");
      colgroup.appendChild(col);
    }
    table.appendChild(colgroup);
  }

  function relativeWeight(width) {
    var match = String(width || "").trim().match(/^(\d+(?:\.\d+)?)x$/i);
    if (!match) return 0;
    return Number(match[1]);
  }

  function applyColumnLayout(table) {
    var widths = columnLayoutOverrideWidths(table);
    if (!widths) widths = computeColumnPixelWidths(table);
    setColumnPixelWidths(table, widths);
  }

  function columnLayoutOverrideWidths(table) {
    var nColumns = (state.columns || []).length;
    if (!columnLayoutOverride || columnLayoutOverride.length !== nColumns) return null;

    return columnLayoutOverride.map(function(width, idx) {
      var spec = columnSpec(table, idx);
      return clampWidth(Number(width), spec.min, spec.max);
    });
  }

  function computeColumnPixelWidths(table) {
    var nColumns = (state.columns || []).length;
    if (nColumns === 0) return [];

    var specs = [];
    var widths = new Array(nColumns);
    var relativeSpecs = [];
    var fixedTotal = 0;
    for (var idx = 0; idx < nColumns; idx++) {
      var spec = columnSpec(table, idx);
      specs.push(spec);
      if (spec.type === "relative") {
        relativeSpecs.push(spec);
        continue;
      }

      var width = spec.pixel;
      if (spec.type === "fit" && !Number.isFinite(width)) {
        width = fitColumnWidth(table, idx);
      }
      width = clampWidth(width, spec.min, spec.max);
      widths[idx] = width;
      fixedTotal += width;
    }

    var tableTarget = targetTableWidth(table, fixedTotal, relativeSpecs);
    var relativeTotal = Math.max(0, tableTarget - fixedTotal);
    var relativeWidths = distributeRelativeWidths(relativeTotal, relativeSpecs);
    relativeSpecs.forEach(function(spec) {
      widths[spec.index] = relativeWidths[spec.index];
    });

    if (relativeSpecs.length === 0) {
      widths = expandWidthsToTarget(widths, specs, tableTarget);
    }
    return widths.map(function(width, idx) {
      return clampWidth(width, specs[idx].min, specs[idx].max);
    });
  }

  function columnSpec(table, idx) {
    var type = normalWidthType(asArray(state.columnWidthType)[idx], asArray(state.columnWidth)[idx]);
    var token = asArray(state.columnWidth)[idx];
    var pixel = columnPixelWidth(type, token, idx);
    var minWidth = numericOrDefault(asArray(state.columnMinWidth)[idx], 24);
    var maxWidth = maxWidthValue(asArray(state.columnMaxWidth)[idx]);
    if (Number.isFinite(maxWidth) && maxWidth < minWidth) maxWidth = minWidth;
    return {
      index: idx,
      type: type,
      token: token,
      pixel: pixel,
      weight: relativeColumnWeight(token),
      min: minWidth,
      max: maxWidth
    };
  }

  function normalWidthType(typeValue, token) {
    var type = String(typeValue == null ? "" : typeValue).toLowerCase();
    if (type === "pixel" || type === "fit" || type === "relative") return type;

    var text = String(token == null ? "" : token).trim().toLowerCase();
    if (text === "fit") return "fit";
    if (text.slice(-2) === "px" || Number.isFinite(Number(token))) return "pixel";
    return "relative";
  }

  function columnPixelWidth(type, token, idx) {
    var measured = numericOrDefault(asArray(state.columnPixelWidth)[idx], NaN);
    if ((type === "fit" || type === "relative") && Number.isFinite(measured) && measured > 0) {
      return measured;
    }
    if (type !== "pixel") return NaN;
    if (Number.isFinite(Number(token))) return Number(token);

    var text = String(token == null ? "" : token).trim().toLowerCase();
    if (text.slice(-2) !== "px") return measured;
    var value = Number(text.slice(0, -2));
    return Number.isFinite(value) ? value : measured;
  }

  function relativeColumnWeight(token) {
    var weight = relativeWeight(token);
    return weight > 0 ? weight : 1;
  }

  function numericOrDefault(value, defaultValue) {
    if (value === null || value === undefined || value === "") return defaultValue;
    var numeric = Number(value);
    if (!Number.isFinite(numeric) || numeric < 0) return defaultValue;
    return numeric;
  }

  function maxWidthValue(value) {
    return numericOrDefault(value, Infinity);
  }

  function clampWidth(width, minWidth, maxWidth) {
    var value = Number.isFinite(width) && width > 0 ? width : minWidth;
    value = Math.max(value, minWidth);
    if (Number.isFinite(maxWidth)) value = Math.min(value, maxWidth);
    return Math.max(1, Math.round(value));
  }

  function fitColumnWidth(table, idx) {
    if (isGroupHeaderColumn(idx + 1)) {
      return Math.max(24, verticalTextFitWidth("td", groupHeaderColumnLabel(idx + 1), cssForCell(1, idx + 1)));
    }

    var width = 0;
    var header = table.querySelector("thead th[data-col='" + (idx + 1) + "']");
    if (header) width = Math.max(width, elementFitWidth(header));
    Array.prototype.forEach.call(table.querySelectorAll("tbody td[data-col='" + (idx + 1) + "']"), function(td) {
      if (td.dataset.groupHeader === "true") return;
      width = Math.max(width, elementFitWidth(td));
    });
    return Math.max(24, width);
  }

  function elementFitWidth(el) {
    var style = window.getComputedStyle(el);
    var probe = document.createElement("span");
    probe.style.cssText = [
      "position:fixed",
      "left:-10000px",
      "top:-10000px",
      "white-space:nowrap",
      "font:" + style.font
    ].join(";") + ";";
    probe.textContent = el.tagName && el.tagName.toLowerCase() === "th" ? headerText(el) : el.textContent || "";

    tooltipEl.style.top = y + "px";

  function tooltipMetricTable(metricTable) {

  function tooltipChart(chart, compact) {

      return Number.isFinite(value) && value >= 0;
    });
    if (counts.length === 0) return null;

    var maxCount = Math.max.apply(null, counts);

    chartEl.dataset.chartType = "histogram";
    chartEl.style.cssText = [
      "display:flex",

  function attachContextMenuEvent(el, row, col) {

    el.style.top = Math.max(0, Number(y || 0)) + "px";

  function renderContextMenuList(items, parentPath) {
    var ul = document.createElement("ul");
    asArray(items).forEach(function(item) {
      var li = document.createElement("li");
      var text = String(item && item.text ? item.text : "");
      var path = parentPath ? parentPath + " > " + text : text;
      var action = String(item && item.action ? item.action : "");
      var enabled = menuItemEnabled(item, action);
      li.dataset.path = path;

            row: contextMenuRow,
            col: contextMenuCol

      var children = asArray(item && item.children);

    var viewW = document.documentElement.clientWidth || window.innerWidth;
    var viewH = document.documentElement.clientHeight || window.innerHeight;

  function groupHeaderLabel(rowValues) {

        return String(values[i]);
      }
    }
    return "";
  }

  function isGroupHeaderRow(row) {
    return asArray(state.groupHeaderRows).map(Number).indexOf(Number(row)) >= 0;

  function groupHeaderLevel(row) {
    var rows = asArray(state.groupHeaderRows).map(Number);
    var levels = asArray(state.groupHeaderLevels).map(Number);
    var idx = rows.indexOf(Number(row));
    if (idx < 0 || !Number.isFinite(levels[idx]) || levels[idx] <= 0) return 1;
    return levels[idx];
  }

  function isGroupHeaderColumn(col) {
    return asArray(state.groupHeaderColumns).map(Number).indexOf(Number(col)) >= 0;
  }

  function groupHeaderColumnLevel(col) {
    var cols = asArray(state.groupHeaderColumns).map(Number);
    var levels = asArray(state.groupHeaderColumnLevels).map(Number);
    var idx = cols.indexOf(Number(col));
    if (idx < 0 || !Number.isFinite(levels[idx]) || levels[idx] <= 0) return 1;

  function clearGroupColumnOverlays(root) {

    clearGroupColumnOverlays(root);
    if (!root || !table) return;

    asArray(state.groupHeaderColumns).map(Number).forEach(function(col) {
      if (!Number.isFinite(col) || col < 1) return;
      var cells = groupColumnCells(col);
      if (cells.length === 0) return;
      var rect = cellUnionRect(root, cells);

      overlay.style.cssText = [
        "left:" + rect.left + "px",
        "top:" + rect.top + "px",
        "width:" + rect.width + "px",
        "height:" + rect.height + "px",
        "color:" + firstCellStyle.color,
        "background-color:" + firstCellStyle.backgroundColor,
        "font-family:" + firstCellStyle.fontFamily,
        "font-size:" + firstCellStyle.fontSize,
        "font-weight:" + firstCellStyle.fontWeight,
        "font-style:" + firstCellStyle.fontStyle,

  function groupColumnCells(col) {
    return Array.prototype.slice.call(document.querySelectorAll(
      "tbody td[data-col='" + Number(col) + "'][data-group-header-column='true']"));

  function cellUnionRect(root, cells) {
    if (!root || cells.length === 0) return null;
    var rootRect = root.getBoundingClientRect();

    var top = Infinity;

    var bottom = -Infinity;
    cells.forEach(function(cell) {

      left = Math.min(left, rect.left);
      top = Math.min(top, rect.top);
      right = Math.max(right, rect.right);
      bottom = Math.max(bottom, rect.bottom);

    if (!Number.isFinite(left) || !Number.isFinite(top) || right <= left || bottom <= top) return null;

      top: top - rootRect.top + (root.scrollTop || 0),
      width: right - left,
      height: bottom - top

  function tableRows() {

  function totalRowCount() {

    if (isRowMajorPayload()) {
      var columnCount = (state.columns || []).length;
      if (columnCount <= 0) return 0;
      return Math.ceil(asArray(state.cellValues).length/columnCount);
    }

    var rows = asArray(state.cellRows).map(Number);
    return rows.reduce(function(maxRow, row) {
      return Number.isFinite(row) ? Math.max(maxRow, row) : maxRow;

  function hasCoordinatePayload() {

    }
    return rowValues;
  }

  function cellValueAt(row, col) {
    var values = asArray(state.cellValues);
    if (isRowMajorPayload()) {
      var columnCount = (state.columns || []).length;
      var valueIndex = (Number(row) - 1)*columnCount + Number(col) - 1;
      if (valueIndex >= 0 && valueIndex < values.length) return values[valueIndex];
    }

    var value = coordinateLookup()[String(row) + ":" + String(col)];
    if (value !== undefined) return value;
    return "";
  }

  function coordinateLookup() {
    if (coordinateLookupCache) return coordinateLookupCache;

    coordinateLookupCache = {};
    var rows = asArray(state.cellRows).map(Number);
    var cols = asArray(state.cellCols).map(Number);
    var values = asArray(state.cellValues);
    for (var i = 0; i < values.length; i++) {
      coordinateLookupCache[String(rows[i]) + ":" + String(cols[i])] = values[i];

  function resetDataCaches() {

  function selectCell(row, col, event) {

      case "column":

  function isCellSelected(row, col) {

    });
  }

  function isRowSelected(row) {
    if (state.selectionType !== "row") return false;
    return selectionValues().indexOf(row) >= 0;
  }

  function isColumnSelected(col) {
    if (state.selectionType !== "column") return false;

  function selectionValues() {

  }

  function selectionValuesForType(type) {
    if (String(state.selectionType || "cell") !== String(type)) return [];

    var selection = state.selection || [];
    var values;
    if (Array.isArray(selection) && selection.length > 0 && Array.isArray(selection[0])) {
      values = selection.map(function(idx) {
        return Number(type === "row" ? idx[0] : idx[1]);
      });
    } else {
      values = flatten(selection).map(Number);
    }
    return uniqueNumbers(values);
  }

  function cellSelectionPairs() {
    var selection = state.selection || [];
    var pairs = [];
    if (Array.isArray(selection) && selection.length > 0 && Array.isArray(selection[0])) {
      selection.forEach(function(idx) {
        if (idx.length >= 2) pairs.push([Number(idx[0]), Number(idx[1])]);
      });
      return pairs;
    }

    var values = flatten(selection).map(Number);
    for (var i = 0; i + 1 < values.length; i += 2) {

  function updateLinearSelection(values, value, event) {
    if (!isMultiEvent(event)) return [value];

  function updateBatchLinearSelection(values, incoming, event) {
    if (!isMultiEvent(event)) return incoming.slice();
    var allSelected = incoming.length > 0 && incoming.every(function(value) {
      return values.indexOf(value) >= 0;
    });

    cell.dispatchEvent(mouseEvent("click", payload));
  }

  function dragSelectCells(payload) {
    var startCell = cellAt(payload.startRow, payload.startCol);
    var endCell = cellAt(payload.endRow, payload.endCol);
    if (!startCell || !endCell) throw new Error("Cell not found");
    startCell.dispatchEvent(mouseEvent("mousedown", {
      clientX: payload.startClientX || 24,
      clientY: payload.startClientY || 24
    }));
    endCell.dispatchEvent(mouseEvent("mouseenter", {
      clientX: payload.endClientX || 48,
      clientY: payload.endClientY || 48
    }));
    document.dispatchEvent(mouseEvent("mouseup", {
      clientX: payload.endClientX || 48,
      clientY: payload.endClientY || 48
    }));
  }

  function dragColumnResize(payload) {
    var handle = document.querySelector(
      "thead th[data-col='" + Number(payload.col) + "'] .column-resize-handle");
    if (!handle) throw new Error("Column resize handle not found");
    var startX = Number(payload.startClientX || 100);
    var endX = Number(payload.endClientX || (startX + Number(payload.delta || 20)));
    handle.dispatchEvent(mouseEvent("mousedown", {
      clientX: startX,
      clientY: Number(payload.clientY || 8)
    }));
    document.dispatchEvent(mouseEvent("mousemove", {
      clientX: endX,
      clientY: Number(payload.clientY || 8)
    }));
    document.dispatchEvent(mouseEvent("mouseup", {
      clientX: endX,
      clientY: Number(payload.clientY || 8)
    }));
  }

  function measureAutoResizeWidths(request) {
    var table = document.querySelector("#root table");
    if (!table) throw new Error("Table not found");
    sendProbeResult(request, { autoResizeWidths: autoResizeColumnWidths(table) });
  }

  function dragRowDrop(payload) {
    var source = rowAt(payload.sourceRow);
    var target = rowAt(payload.targetRow);
    if (!source || !target) throw new Error("Row not found");

    source.dispatchEvent(dragMouseEvent("dragstart", payload));
    if (rowDrag) rowDrag.probeKey = probeDragKey(payload);
    target.dispatchEvent(dragMouseEvent("dragover", payload));
    target.dispatchEvent(dragMouseEvent("drop", payload));
    source.dispatchEvent(dragMouseEvent("dragend", payload));
  }

  function probeDragKey(payload) {
    if (payload.dragKey !== undefined) return String(payload.dragKey);
    if (payload.key !== undefined) return String(payload.key);
    return "";
  }

  function setRootSize(payload) {
    var root = document.getElementById("root");
    if (!root) throw new Error("Root not found");
    if (payload.width !== undefined) root.style.width = Number(payload.width) + "px";
    if (payload.height !== undefined) root.style.height = Number(payload.height) + "px";
    var table = document.querySelector("#root table");
    if (table) {
      applyColumnLayout(table);
      renderBodyWindow();
    }
  }

  function scrollToRow(payload) {
    var root = document.getElementById("root");
    if (!root) throw new Error("Root not found");
    var row = Math.max(1, Number(payload.row || 1));
    pendingScrollRow = row;
    root.scrollTop = rowScrollTop(row);
    renderBodyWindow();
  }

  function scrollHorizontal(payload) {
    var root = document.getElementById("root");
    if (!root) throw new Error("Root not found");
    root.scrollLeft = Number(payload.left || payload.scrollLeft || 0);
  }

  function rowScrollTop(row) {
    return Math.max(0, HEADER_HEIGHT_PX + (Math.max(1, Number(row || 1)) - 1)*ROW_HEIGHT_PX);
  }

  function doubleClickCell(payload) {
    var cell = cellAt(payload.row, payload.col);
    if (!cell) throw new Error("Cell not found");
    cell.dispatchEvent(mouseEvent("dblclick", payload));
  }

  function editCell(payload) {
    var cell = cellAt(payload.row, payload.col);
    if (!cell) throw new Error("Cell not found");
    cell.textContent = payload.value == null ? "" : String(payload.value);
    cell.dispatchEvent(new Event("blur", { bubbles: true, cancelable: true }));
  }

  function clickHeader(payload) {
    var header = document.querySelector("thead th[data-col='" + Number(payload.col) + "']");
    if (!header) throw new Error("Header not found");
    header.dispatchEvent(mouseEvent("click", payload));
  }

  function clickHeaderSortButton(payload) {
    var button = document.querySelector(
      "thead th[data-col='" + Number(payload.col) + "'] .header-menu-button");
    if (!button) throw new Error("Header sort button not found");
    button.dispatchEvent(mouseEvent("click", payload));
  }

  function clickRowHeaderSortButton(payload) {
    var button = document.querySelector(
      "tbody td[data-row='" + Number(payload.row) + "'][data-col='1'] .row-sort-button");
    if (!button) throw new Error("Row header sort button not found");
    button.dispatchEvent(mouseEvent("click", payload));
  }

  function hoverCell(payload, request) {
    var cell = cellAt(payload.row, payload.col);
    if (!cell) throw new Error("Cell not found");
    pendingTooltipProbe = request;
    cell.dispatchEvent(mouseEvent("mouseenter", hoverPayloadForCell(cell, payload)));
  }

  function leaveCell(payload) {
    var cell = cellAt(payload.row, payload.col);
    if (!cell) throw new Error("Cell not found");
    cell.dispatchEvent(mouseEvent("mouseleave", payload));
  }

  function hoverPayloadForCell(cell, payload) {
    if (!cell || !cell.dataset || cell.dataset.groupHeader !== "true") return payload;

    var header = document.querySelector("thead th[data-col='" + Number(payload.col) + "']");
    if (!header) return payload;

    var rect = header.getBoundingClientRect();
    var nextPayload = {};
    Object.keys(payload || {}).forEach(function(key) {
      nextPayload[key] = payload[key];
    });
    nextPayload.clientX = rect.left + rect.width/2;
    nextPayload.clientY = rect.top + rect.height/2;
    return nextPayload;
  }

  function openContextMenu(payload) {
    var cell = cellAt(payload.row, payload.col);
    if (!cell) throw new Error("Cell not found");
    cell.dispatchEvent(mouseEvent("contextmenu", payload));
  }

  function hoverContextMenuItem(payload) {
    if (!contextMenuEl || contextMenuEl.style.display === "none") {
      openContextMenu(payload);
    }

    var path = String(payload.path || payload.text || "");
    var parts = path.split(" > ");
    var currentPath = "";
    var item = null;
    for (var i = 0; i < parts.length; i++) {
      currentPath = currentPath ? currentPath + " > " + parts[i] : parts[i];
      item = contextMenuItemByPath(currentPath);
      if (!item) throw new Error("Context menu item not found: " + currentPath);
      item.dispatchEvent(mouseEvent("mouseenter", payload));
    }
  }

  function selectContextMenuItem(payload) {
    if (!contextMenuEl || contextMenuEl.style.display === "none") {
      openContextMenu(payload);
    }

    var path = String(payload.path || payload.text || "");
    var item = contextMenuItemByPath(path);
    if (!item) throw new Error("Context menu item not found: " + path);
    if (item.dataset.enabled === "false") throw new Error("Context menu item is disabled: " + path);
    item.dispatchEvent(mouseEvent("click", payload));
  }

  function contextMenuItemByPath(path) {
    if (!contextMenuEl) return null;
    var items = contextMenuEl.querySelectorAll("li");
    for (var i = 0; i < items.length; i++) {
      if ((items[i].dataset.path || "") === path || firstTextNode(items[i]) === path) {
        return items[i];
      }
    }
    return null;
  }

  function rowAt(row) {
    return document.querySelector("tbody tr[data-rendered-row='" + Number(row) + "']");
  }

  function cellAt(row, col) {
    if (Number(row) === 0) {
      return document.querySelector("thead th[data-col='" + Number(col) + "']");
    }
    var cell = document.querySelector(
      "tbody td[data-row='" + Number(row) + "'][data-col='" + Number(col) + "']");
    if (cell) return cell;
    return document.querySelector(
      "tbody td[data-row='" + Number(row) + "'][data-group-header='true']");
  }

  function mouseEvent(type, payload) {
    return new MouseEvent(type, {
      bubbles: true,
      cancelable: true,
      clientX: Number(payload.clientX || 24),
      clientY: Number(payload.clientY || 24),
      ctrlKey: !!payload.ctrlKey,
      metaKey: !!payload.metaKey,
      shiftKey: !!payload.shiftKey
    });
  }

  function dragMouseEvent(type, payload) {
    var event = mouseEvent(type, payload);
    if (payload.key !== undefined) {
      Object.defineProperty(event, "gwidgetsKey", {
        value: String(payload.key)
      });
    }
    if (payload.placement) {
      Object.defineProperty(event, "gwidgetsPlacement", {
        value: String(payload.placement)
      });
    }
    return event;
  }

  function setup(component) {
    htmlComponent = component;
    var root = document.getElementById("root");
    if (root) {
      root.tabIndex = 0;
      root.addEventListener("copy", handleClipboardCopy, true);
      root.addEventListener("paste", handleClipboardPaste, true);
      root.addEventListener("keydown", handleClipboardKeyDown, true);
      root.addEventListener("mousedown", function() {
        root.focus();
      }, true);
    }
    document.addEventListener("click", function() {
      hideContextMenu();
    });
    htmlComponent.addEventListener("Render", function(event) {
      render(event.Data || {});
    });
    htmlComponent.addEventListener("SetTooltip", function(event) {
      renderTooltipBlocks((event.Data && event.Data.blocks) || []);
      if (pendingTooltipProbe) {
        var request = pendingTooltipProbe;
        pendingTooltipProbe = null;
        sendProbeResult(request, snapshot());
      }
    });
    htmlComponent.addEventListener("Probe", function(event) {
      handleProbe(event.Data || {});
    });
    htmlComponent.addEventListener("AutoResizeColumns", function() {
      autoResizeColumns();
    });
    send({ event: "BackendReady" });
  }
  </script>
</head>
<body>
  <div id="root" class="table-wrap"></div>
</body>
</html>
