<!DOCTYPE html>
<html>
<head>
  <style>
    :root {
      color-scheme: light;
      font: 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --table-bg: #fff;
      --table-text: #222;
      --table-border: #d6d6d6;
      --header-bg: #f5f5f5;
      --selected-bg: #d9ecff;
      --selected-outline: #6aa7e8;
      --editable-bg: #fffdf2;
      --menu-bg: #fff;
      --menu-text: #222;
      --menu-border: #b8b8b8;
      --menu-hover-bg: #e7f1ff;
      --menu-disabled-text: #9a9a9a;
      --menu-shadow: rgba(0, 0, 0, 0.18);
      --submenu-border: #e1e1e1;
    }

    body[data-theme="dark"] {
      color-scheme: dark;
      --table-bg: #212121;
      --table-text: #f1f1f1;
      --table-border: #555;
      --header-bg: #2f2f2f;
      --selected-bg: #174a73;
      --selected-outline: #5b9bd5;
      --editable-bg: #2e2a1f;
      --menu-bg: #2b2b2b;
      --menu-text: #f1f1f1;
      --menu-border: #666;
      --menu-hover-bg: #3f5872;
      --menu-disabled-text: #8b8b8b;
      --menu-shadow: rgba(0, 0, 0, 0.45);
      --submenu-border: #555;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    .table-wrap {
      width: 100vw;
      height: 100vh;
      overflow: auto;
      background: var(--table-bg);
      color: var(--table-text);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th,
    td {
      min-width: 24px;
      height: 24px;
      padding: 2px 6px;
      border: 1px solid var(--table-border);
      box-sizing: border-box;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      vertical-align: middle;
      user-select: none;
      -webkit-user-select: none;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--header-bg);
      color: var(--table-text);
      font-weight: 600;
      text-align: left;
    }

    td.selected,
    tr.selected-row td,
    th.selected-column,
    td.selected-column {
      background: var(--selected-bg);
      outline: 1px solid var(--selected-outline);
      outline-offset: -1px;
    }

    td[contenteditable="true"] {
      background: var(--editable-bg);
    }

    td.group-header-cell {
      cursor: pointer;
      font-weight: 600;
    }

    .context-menu {
      position: fixed;
      z-index: 10000;
      min-width: 160px;
      max-width: 320px;
      display: none;
      padding: 4px 0;
      border: 1px solid var(--menu-border);
      background: var(--menu-bg);
      box-shadow: 0 4px 14px var(--menu-shadow);
      color: var(--menu-text);
    }

    .context-menu ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .context-menu li {
      position: relative;
      padding: 4px 12px;
      cursor: default;
      white-space: nowrap;
    }

    .context-menu li[data-enabled="true"][data-action]:hover {
      background: var(--menu-hover-bg);
    }

    .context-menu li[data-enabled="false"] {
      color: var(--menu-disabled-text);
    }

    .context-menu li ul {
      position: absolute;
      top: -5px;
      left: 100%;
      min-width: 160px;
      display: none;
      padding: 4px 0;
      border: 1px solid var(--menu-border);
      background: var(--menu-bg);
      box-shadow: 0 4px 14px var(--menu-shadow);
    }

    .context-menu li.open > ul,
    .context-menu li:hover > ul {
      display: block;
    }

    .context-menu li.has-children {
      padding-right: 24px;
    }

    .context-menu li.has-children::after {
      position: absolute;
      right: 8px;
      content: ">";
    }
  </style>
  <script>
  var htmlComponent = null;
  var state = {
    columns: [],
    values: [],
    rowCount: 0,
    cellRows: [],
    cellCols: [],
    cellValues: [],
    selectionType: "cell",
    multiselect: "on",
    selection: [],
    columnEditable: [],
    columnSortable: [],
    columnWidth: [],
    groupHeaderRows: [],
    groupHeaderLevels: [],
    tooltip: "",
    contextMenu: [],
    theme: "light",
    styles: []
  };
  var lastClientX = 0;
  var lastClientY = 0;
  var tooltipEl = null;
  var pendingTooltipProbe = null;
  var contextMenuEl = null;
  var contextMenuRow = 0;
  var contextMenuCol = 0;
  var dragSelect = null;
  var suppressNextClickSelection = false;
  var handledProbeIds = {};

  function asArray(value) {
    if (!value) return [];
    if (!Array.isArray(value)) return [value];
    return value;
  }

  function flatten(value) {
    var result = [];
    asArray(value).forEach(function(item) {
      if (Array.isArray(item)) {
        result = result.concat(flatten(item));
      } else if (item !== undefined && item !== null && item !== "") {
        result.push(item);
      }
    });
    return result;
  }

  function normaliseTableRows(value) {
    if (!value || !Array.isArray(value) || value.length === 0) return [];
    if (Array.isArray(value[0])) return value;
    return [value];
  }

  function send(data) {
    if (htmlComponent) htmlComponent.Data = data;
  }

  function sendProbeResult(request, extra) {
    var result = Object.assign({
      event: "ProbeResult",
      id: Number(request.id || -1),
      probe: String(request.probe || "")
    }, extra || {});
    send(result);
  }

  function render(payload) {
    state = Object.assign(state, payload || {});
    applyTheme(state.theme);
    var root = document.getElementById("root");
    root.textContent = "";

    var table = document.createElement("table");
    table.title = state.tooltip || "";
    renderColgroup(table);
    renderHeader(table);
    renderBody(table);
    root.appendChild(table);
  }

  function applyTheme(theme) {
    var normalised = String(theme || "light").toLowerCase();
    if (normalised !== "dark") normalised = "light";
    document.body.dataset.theme = normalised;
  }

  function renderColgroup(table) {
    if (!state.columnWidth || state.columnWidth.length === 0) return;
    var colgroup = document.createElement("colgroup");
    cssColumnWidths(state.columnWidth).forEach(function(width) {
      var col = document.createElement("col");
      if (width) col.style.width = width;
      colgroup.appendChild(col);
    });
    table.appendChild(colgroup);
  }

  function cssColumnWidths(widths) {
    var values = asArray(widths).map(function(width) {
      return String(width == null ? "" : width).trim();
    });
    var weights = values.map(relativeWeight);
    var totalWeight = weights.reduce(function(total, weight) {
      return total + weight;
    }, 0);

    return values.map(function(width, idx) {
      if (!width || width.toLowerCase() === "auto") return "";
      if (weights[idx] > 0 && totalWeight > 0) {
        return ((100*weights[idx])/totalWeight).toFixed(6).replace(/\.?0+$/, "") + "%";
      }
      return width;
    });
  }

  function relativeWeight(width) {
    var match = String(width || "").trim().match(/^(\d+(?:\.\d+)?)x$/i);
    if (!match) return 0;
    return Number(match[1]);
  }

  function renderHeader(table) {
    var thead = document.createElement("thead");
    var row = document.createElement("tr");
    state.columns.forEach(function(name, idx) {
      var th = document.createElement("th");
      th.textContent = name;
      th.dataset.col = idx + 1;
      th.title = state.tooltip || "";
      applyCssText(th, cssForCell(0, idx + 1));
      if (isColumnSelected(idx + 1)) th.classList.add("selected-column");
      attachTooltipEvents(th, 0, idx + 1);
      attachContextMenuEvent(th, 0, idx + 1);
      th.addEventListener("click", function(event) {
        if (indexedBoolean(state.columnSortable, idx)) {
          send({
            event: "DisplayDataChanged",
            interaction: "sort",
            variable: state.columns[idx]
          });
        } else {
          selectCell(1, idx + 1, event);
        }
      });
      row.appendChild(th);
    });
    thead.appendChild(row);
    table.appendChild(thead);
  }

  function renderBody(table) {
    var tbody = document.createElement("tbody");
    var rows = tableRows();
    rows.forEach(function(rowValues, rowIdx) {
      var row = document.createElement("tr");
      var displayRow = rowIdx + 1;
      if (isRowSelected(displayRow)) row.classList.add("selected-row");
      if (isGroupHeaderRow(displayRow)) {
        renderGroupHeaderRow(row, rowValues, displayRow);
        tbody.appendChild(row);
        return;
      }
      asArray(rowValues).forEach(function(value, colIdx) {
        var displayCol = colIdx + 1;
        var td = document.createElement("td");
        td.textContent = value == null ? "" : String(value);
        td.dataset.row = displayRow;
        td.dataset.col = displayCol;
        td.title = state.tooltip || "";
        applyCssText(td, cssForCell(displayRow, displayCol));
        attachTooltipEvents(td, displayRow, displayCol);
        attachContextMenuEvent(td, displayRow, displayCol);
        attachCellDragSelection(td, displayRow, displayCol);
        if (isCellSelected(displayRow, displayCol)) td.classList.add("selected");
        if (isColumnSelected(displayCol)) td.classList.add("selected-column");
        if (indexedBoolean(state.columnEditable, colIdx)) {
          td.contentEditable = "true";
          td.addEventListener("blur", function() {
            send({ event: "CellEdited", row: displayRow, col: displayCol, value: td.textContent });
          });
        }
        td.addEventListener("click", function(event) {
          if (suppressNextClickSelection) {
            suppressNextClickSelection = false;
            event.preventDefault();
            event.stopPropagation();
            return;
          }
          send({ event: "CellClicked", row: displayRow, col: displayCol });
          selectCell(displayRow, displayCol, event);
        });
        td.addEventListener("dblclick", function() {
          send({ event: "CellDoubleClicked", row: displayRow, col: displayCol });
        });
        row.appendChild(td);
      });
      tbody.appendChild(row);
    });
    table.appendChild(tbody);
  }

  function renderGroupHeaderRow(row, rowValues, displayRow) {
    var td = document.createElement("td");
    td.textContent = groupHeaderLabel(rowValues);
    td.dataset.row = displayRow;
    td.dataset.col = 1;
    td.dataset.groupHeader = "true";
    td.dataset.groupLevel = groupHeaderLevel(displayRow);
    td.colSpan = Math.max((state.columns || []).length, 1);
    td.className = "group-header-cell group-level-" + td.dataset.groupLevel;
    td.title = state.tooltip || td.textContent || "";
    applyCssText(td, cssForCell(displayRow, 1));
    attachTooltipEvents(td, displayRow, 1);
    attachContextMenuEvent(td, displayRow, 1);
    td.addEventListener("click", function() {
      send({ event: "CellClicked", row: displayRow, col: 1 });
    });
    td.addEventListener("dblclick", function() {
      send({ event: "CellDoubleClicked", row: displayRow, col: 1 });
    });
    row.appendChild(td);
  }

  function attachCellDragSelection(el, row, col) {
    el.addEventListener("mousedown", function(event) {
      if (event.button !== 0 || state.selectionType !== "cell") return;
      beginDragSelection(row, col, event);
    });
    el.addEventListener("mouseenter", function(event) {
      updateDragSelection(row, col, event);
    });
  }

  function beginDragSelection(row, col, event) {
    if (state.multiselect === "off") return;
    hideContextMenu();
    event.preventDefault();
    dragSelect = {
      startRow: Number(row),
      startCol: Number(col),
      endRow: Number(row),
      endCol: Number(col),
      moved: false
    };
    document.addEventListener("mouseup", finishDragSelection, true);
    paintDragSelection(rectSelectionPairs(dragSelect));
  }

  function updateDragSelection(row, col, event) {
    if (!dragSelect || state.selectionType !== "cell") return;
    event.preventDefault();
    if (dragSelect.endRow !== Number(row) || dragSelect.endCol !== Number(col)) {
      dragSelect.moved = true;
    }
    dragSelect.endRow = Number(row);
    dragSelect.endCol = Number(col);
    paintDragSelection(rectSelectionPairs(dragSelect));
  }

  function finishDragSelection(event) {
    document.removeEventListener("mouseup", finishDragSelection, true);
    if (!dragSelect) return;
    var pairs = rectSelectionPairs(dragSelect);
    var didMove = dragSelect.moved;
    dragSelect = null;
    if (!didMove) return;

    if (event) event.preventDefault();
    suppressNextClickSelection = true;
    state.selection = pairs;
    send({ event: "SelectionChanged", indices: pairs });
    render(state);
  }

  function rectSelectionPairs(selection) {
    var rowStart = Math.min(selection.startRow, selection.endRow);
    var rowEnd = Math.max(selection.startRow, selection.endRow);
    var colStart = Math.min(selection.startCol, selection.endCol);
    var colEnd = Math.max(selection.startCol, selection.endCol);
    var pairs = [];
    for (var row = rowStart; row <= rowEnd; row++) {
      for (var col = colStart; col <= colEnd; col++) {
        if (!isGroupHeaderRow(row)) pairs.push([row, col]);
      }
    }
    return pairs;
  }

  function paintDragSelection(pairs) {
    Array.prototype.forEach.call(document.querySelectorAll("tbody td.selected"), function(td) {
      td.classList.remove("selected");
    });
    pairs.forEach(function(pair) {
      var td = cellAt(pair[0], pair[1]);
      if (td && td.dataset.groupHeader !== "true") td.classList.add("selected");
    });
  }

  function attachTooltipEvents(el, row, col) {
    el.addEventListener("mouseenter", function(event) {
      handleTooltipEnter(event, row, col);
    });
    el.addEventListener("mousemove", function(event) {
      handleTooltipMove(event);
    });
    el.addEventListener("mouseleave", function() {
      hideTooltip();
      send({ event: "CellLeave" });
    });
  }

  function handleTooltipEnter(event, row, col) {
    lastClientX = event.clientX || 0;
    lastClientY = event.clientY || 0;
    hideTooltip();
    send({ event: "CellHover", row: row, col: col });
  }

  function handleTooltipMove(event) {
    lastClientX = event.clientX || lastClientX;
    lastClientY = event.clientY || lastClientY;
    positionTooltipNearCursor();
  }

  function ensureTooltipEl() {
    if (tooltipEl && tooltipEl.isConnected) return tooltipEl;
    tooltipEl = document.createElement("div");
    tooltipEl.id = "gwidgets-tooltip";
    tooltipEl.style.cssText = tooltipBaseCss() + "display:none;";
    document.body.appendChild(tooltipEl);
    return tooltipEl;
  }

  function tooltipBaseCss() {
    return [
      "position:fixed",
      "z-index:9999",
      "pointer-events:none",
      "white-space:pre",
      "font-family:sans-serif"
    ].join(";") + ";";
  }

  function hideTooltip() {
    if (tooltipEl) tooltipEl.style.display = "none";
  }

  function positionTooltipNearCursor() {
    if (!tooltipEl || tooltipEl.style.display === "none") return;
    var w = tooltipEl.offsetWidth || 0;
    var h = tooltipEl.offsetHeight || 0;
    var viewW = document.documentElement.clientWidth || window.innerWidth;
    var viewH = document.documentElement.clientHeight || window.innerHeight;
    var x = lastClientX + 12;
    var y = lastClientY + 16;
    if (x + w + 8 > viewW) x = Math.max(0, lastClientX - w - 12);
    if (y + h + 8 > viewH) y = Math.max(0, lastClientY - h - 12);
    tooltipEl.style.left = x + "px";
    tooltipEl.style.top = y + "px";
  }

  function renderTooltipBlocks(blocks) {
    var el = ensureTooltipEl();
    var blockList = asArray(blocks);
    if (blockList.length === 0) {
      hideTooltip();
      return;
    }

    el.style.cssText = tooltipBaseCss();
    while (el.firstChild) el.removeChild(el.firstChild);
    blockList.forEach(function(block, idx) {
      var blockDiv = document.createElement("div");
      if (block && block.containerCss) blockDiv.style.cssText = String(block.containerCss);
      if (idx > 0) blockDiv.style.marginTop = "2px";
      asArray(block && block.lines).forEach(function(line) {
        var lineDiv = document.createElement("div");
        lineDiv.textContent = line && line.text ? String(line.text) : "";
        if (line && line.css) lineDiv.style.cssText = String(line.css);
        blockDiv.appendChild(lineDiv);
      });
      el.appendChild(blockDiv);
    });
    el.style.display = "block";
    positionTooltipNearCursor();
  }

  function attachContextMenuEvent(el, row, col) {
    el.addEventListener("contextmenu", function(event) {
      event.preventDefault();
      showContextMenu(row, col, event.clientX || 0, event.clientY || 0);
    });
  }

  function ensureContextMenuEl() {
    if (contextMenuEl && contextMenuEl.isConnected) return contextMenuEl;
    contextMenuEl = document.createElement("div");
    contextMenuEl.id = "gwidgets-context-menu";
    contextMenuEl.className = "context-menu";
    document.body.appendChild(contextMenuEl);
    return contextMenuEl;
  }

  function hideContextMenu() {
    if (contextMenuEl) contextMenuEl.style.display = "none";
  }

  function showContextMenu(row, col, x, y) {
    var items = asArray(state.contextMenu);
    if (items.length === 0) {
      hideContextMenu();
      return;
    }

    contextMenuRow = Number(row || 0);
    contextMenuCol = Number(col || 0);
    var el = ensureContextMenuEl();
    el.textContent = "";
    el.appendChild(renderContextMenuList(items, ""));
    el.style.left = Math.max(0, Number(x || 0)) + "px";
    el.style.top = Math.max(0, Number(y || 0)) + "px";
    el.style.display = "block";
  }

  function renderContextMenuList(items, parentPath) {
    var ul = document.createElement("ul");
    asArray(items).forEach(function(item) {
      var li = document.createElement("li");
      var text = String(item && item.text ? item.text : "");
      var path = parentPath ? parentPath + " > " + text : text;
      var action = String(item && item.action ? item.action : "");
      var enabled = item && item.enabled !== false;
      li.textContent = text;
      li.dataset.path = path;
      li.dataset.enabled = enabled ? "true" : "false";
      if (action) {
        li.dataset.action = action;
        li.dataset.value = JSON.stringify(asArray(item.value).map(String));
      }
      if (enabled && action) {
        li.addEventListener("click", function(event) {
          event.stopPropagation();
          send({
            event: "ContextMenuAction",
            action: action,
            value: JSON.parse(li.dataset.value || "[]"),
            row: contextMenuRow,
            col: contextMenuCol
          });
          hideContextMenu();
        });
      }

      var children = asArray(item && item.children);
      if (children.length > 0) {
        li.classList.add("has-children");
        li.addEventListener("mouseenter", function(event) {
          event.stopPropagation();
          openContextMenuBranch(li);
        });
        li.addEventListener("mouseleave", function() {
          li.classList.remove("open");
        });
        li.appendChild(renderContextMenuList(children, path));
      }
      ul.appendChild(li);
    });
    return ul;
  }

  function openContextMenuBranch(item) {
    var siblings = item.parentElement ? item.parentElement.children : [];
    Array.prototype.forEach.call(siblings, function(sibling) {
      if (sibling !== item) sibling.classList.remove("open");
    });
    item.classList.add("open");
    positionSubmenu(item);
  }

  function positionSubmenu(item) {
    var submenu = childLists(item)[0];
    if (!submenu) return;
    submenu.style.left = "100%";
    submenu.style.right = "auto";
    submenu.style.top = "-5px";

    var rect = submenu.getBoundingClientRect();
    var viewW = document.documentElement.clientWidth || window.innerWidth;
    var viewH = document.documentElement.clientHeight || window.innerHeight;
    if (rect.right > viewW && item.getBoundingClientRect().left > rect.width) {
      submenu.style.left = "auto";
      submenu.style.right = "100%";
    }
    if (rect.bottom > viewH) {
      submenu.style.top = Math.min(-5, viewH - rect.bottom - 5) + "px";
    }
  }

  function childLists(item) {
    return Array.prototype.filter.call(item.children, function(child) {
      return String(child.tagName || "").toUpperCase() === "UL";
    });
  }

  function groupHeaderLabel(rowValues) {
    var values = asArray(rowValues);
    for (var i = 0; i < values.length; i++) {
      if (values[i] !== undefined && values[i] !== null && String(values[i]) !== "") {
        return String(values[i]);
      }
    }
    return "";
  }

  function isGroupHeaderRow(row) {
    return asArray(state.groupHeaderRows).map(Number).indexOf(Number(row)) >= 0;
  }

  function groupHeaderLevel(row) {
    var rows = asArray(state.groupHeaderRows).map(Number);
    var levels = asArray(state.groupHeaderLevels).map(Number);
    var idx = rows.indexOf(Number(row));
    if (idx < 0 || !Number.isFinite(levels[idx]) || levels[idx] <= 0) return 1;
    return levels[idx];
  }

  function tableRows() {
    if (state.cellRows && state.cellRows.length > 0) {
      return coordinateRows();
    }
    return normaliseTableRows(state.values);
  }

  function coordinateRows() {
    var rowCount = Number(state.rowCount || 0);
    var columnCount = (state.columns || []).length;
    var rows = [];
    for (var row = 1; row <= rowCount; row++) {
      var rowValues = [];
      for (var col = 1; col <= columnCount; col++) {
        rowValues.push(cellValueAt(row, col));
      }
      rows.push(rowValues);
    }
    return rows;
  }

  function cellValueAt(row, col) {
    var rows = asArray(state.cellRows).map(Number);
    var cols = asArray(state.cellCols).map(Number);
    var values = asArray(state.cellValues);
    for (var i = 0; i < values.length; i++) {
      if (rows[i] === row && cols[i] === col) return values[i];
    }
    return "";
  }

  function selectCell(row, col, event) {
    var indices;
    switch (state.selectionType) {
      case "row":
        indices = updateLinearSelection(selectionValues(), row, event).map(function(selectedRow) {
          return [selectedRow, col];
        });
        state.selection = indices.map(function(idx) { return idx[0]; });
        break;
      case "column":
        indices = updateLinearSelection(selectionValues(), col, event).map(function(selectedCol) {
          return [row, selectedCol];
        });
        state.selection = indices.map(function(idx) { return idx[1]; });
        break;
      default:
        indices = updateCellSelection(cellSelectionPairs(), [row, col], event);
        state.selection = indices;
    }
    send({ event: "SelectionChanged", indices: indices });
    render(state);
  }

  function isCellSelected(row, col) {
    if (state.selectionType !== "cell") return false;
    return cellSelectionPairs().some(function(idx) {
      return idx[0] === row && idx[1] === col;
    });
  }

  function isRowSelected(row) {
    if (state.selectionType !== "row") return false;
    return selectionValues().indexOf(row) >= 0;
  }

  function isColumnSelected(col) {
    if (state.selectionType !== "column") return false;
    return selectionValues().indexOf(col) >= 0;
  }

  function selectionValues() {
    var selection = state.selection || [];
    var values;
    if (Array.isArray(selection) && selection.length > 0 && Array.isArray(selection[0])) {
      values = selection.map(function(idx) {
        return Number(state.selectionType === "row" ? idx[0] : idx[1]);
      });
    } else {
      values = flatten(selection).map(Number);
    }
    return uniqueNumbers(values);
  }

  function cellSelectionPairs() {
    var selection = state.selection || [];
    var pairs = [];
    if (Array.isArray(selection) && selection.length > 0 && Array.isArray(selection[0])) {
      selection.forEach(function(idx) {
        if (idx.length >= 2) pairs.push([Number(idx[0]), Number(idx[1])]);
      });
      return pairs;
    }

    var values = flatten(selection).map(Number);
    for (var i = 0; i + 1 < values.length; i += 2) {
      pairs.push([values[i], values[i + 1]]);
    }
    return pairs;
  }

  function updateLinearSelection(values, value, event) {
    if (!isMultiEvent(event)) return [value];
    if (values.indexOf(value) >= 0) {
      return values.filter(function(existing) { return existing !== value; });
    }
    values.push(value);
    return values;
  }

  function updateCellSelection(pairs, pair, event) {
    if (!isMultiEvent(event)) return [pair];
    var exists = pairs.some(function(existing) {
      return existing[0] === pair[0] && existing[1] === pair[1];
    });
    if (exists) {
      return pairs.filter(function(existing) {
        return existing[0] !== pair[0] || existing[1] !== pair[1];
      });
    }
    pairs.push(pair);
    return pairs;
  }

  function isMultiEvent(event) {
    return state.multiselect !== "off" && event && (event.ctrlKey || event.metaKey);
  }

  function uniqueNumbers(values) {
    var result = [];
    values.forEach(function(value) {
      if (Number.isFinite(value) && result.indexOf(value) < 0) result.push(value);
    });
    return result;
  }

  function indexedBoolean(value, idx) {
    if (Array.isArray(value)) return !!value[idx];
    return !!value;
  }

  function cssForCell(row, col) {
    var css = "";
    asArray(state.styles).forEach(function(rule) {
      if (!rule || !rule.css || !styleMatches(rule, row, col)) return;
      css += ";" + String(rule.css);
    });
    return css;
  }

  function styleMatches(rule, row, col) {
    switch (String(rule.target)) {
      case "table":
        return true;
      case "row":
        return row > 0 && containsIndex(rule.index, row);
      case "column":
        return containsIndex(rule.index, col);
      case "cell":
        return row > 0 && containsCellIndex(rule.index, row, col);
      default:
        return false;
    }
  }

  function containsIndex(index, value) {
    return flatten(index).map(Number).indexOf(value) >= 0;
  }

  function containsCellIndex(index, row, col) {
    var pairs = [];
    if (Array.isArray(index) && index.length > 0 && Array.isArray(index[0])) {
      pairs = index;
    } else {
      var values = flatten(index).map(Number);
      for (var i = 0; i + 1 < values.length; i += 2) {
        pairs.push([values[i], values[i + 1]]);
      }
    }
    return pairs.some(function(pair) {
      return Number(pair[0]) === row && Number(pair[1]) === col;
    });
  }

  function applyCssText(el, cssText) {
    if (!cssText) return;
    el.style.cssText += ";" + cssText;
  }

  function handleProbe(request) {
    try {
      var probeId = String(request.id || "");
      if (probeId && handledProbeIds[probeId]) {
        if (pendingTooltipProbe && String(pendingTooltipProbe.id || "") === probeId) return;
        sendDeferredProbeResult(request);
        return;
      }
      if (probeId) handledProbeIds[probeId] = true;

      var payload = request.payload || {};
      switch (String(request.probe || "")) {
        case "Snapshot":
          sendProbeResult(request, snapshot());
          break;
        case "ClickCell":
          clickCell(payload);
          sendDeferredProbeResult(request);
          break;
        case "DragSelectCells":
          dragSelectCells(payload);
          sendDeferredProbeResult(request);
          break;
        case "DoubleClickCell":
          doubleClickCell(payload);
          sendDeferredProbeResult(request);
          break;
        case "EditCell":
          editCell(payload);
          sendDeferredProbeResult(request);
          break;
        case "ClickHeader":
          clickHeader(payload);
          sendDeferredProbeResult(request);
          break;
        case "HoverCell":
          hoverCell(payload, request);
          break;
        case "ClearTooltip":
          hideTooltip();
          sendProbeResult(request, snapshot());
          break;
        case "OpenContextMenu":
          openContextMenu(payload);
          sendProbeResult(request, snapshot());
          break;
        case "HoverContextMenuItem":
          hoverContextMenuItem(payload);
          sendProbeResult(request, snapshot());
          break;
        case "SelectContextMenuItem":
          selectContextMenuItem(payload);
          sendDeferredProbeResult(request);
          break;
        default:
          throw new Error("Unknown probe: " + String(request.probe || ""));
      }
    } catch (err) {
      sendProbeResult(request, { error: String(err && err.message ? err.message : err) });
    }
  }

  function sendDeferredProbeResult(request) {
    setTimeout(function() {
      try {
        sendProbeResult(request, snapshot());
      } catch (err) {
        sendProbeResult(request, { error: String(err && err.message ? err.message : err) });
      }
    }, 25);
  }

  function snapshot() {
    var root = document.getElementById("root");
    var table = document.querySelector("#root table");
    var tooltip = tooltipSnapshot();
    var contextMenu = contextMenuSnapshot();
    var tableTitle = table ? table.title || "" : "";
    var rootStyle = root ? window.getComputedStyle(root) : null;
    var headerTexts = [];
    var headerTitles = [];
    var headerBackgroundColors = [];
    var cellRows = [];
    var cellCols = [];
    var cellTexts = [];
    var cellTitles = [];
    var cellClasses = [];
    var cellCssTexts = [];
    var cellBackgroundColors = [];
    var cellColors = [];
    var colStyleWidths = [];
    var headerWidths = [];
    var groupHeaderRows = [];
    var groupHeaderLabels = [];
    var groupHeaderLevels = [];
    var groupHeaderColSpans = [];
    var groupHeaderCssTexts = [];
    var groupHeaderBackgroundColors = [];
    var groupHeaderColors = [];
    var editableRows = [];
    var editableCols = [];
    var selectedCellRows = [];
    var selectedCellCols = [];
    var selectedRows = [];
    var selectedColumns = [];
    if (!table) {
      return {
        rowCount: 0,
        columnCount: 0,
        theme: String(document.body.dataset.theme || "light"),
        tableBackgroundColor: rootStyle ? rootStyle.backgroundColor || "" : "",
        tableTitle: tableTitle,
        headerTexts: headerTexts,
        headerTitles: headerTitles,
        headerBackgroundColors: headerBackgroundColors,
        cellRows: cellRows,
        cellCols: cellCols,
        cellTexts: cellTexts,
        cellTitles: cellTitles,
        cellClasses: cellClasses,
        cellCssTexts: cellCssTexts,
        cellBackgroundColors: cellBackgroundColors,
        cellColors: cellColors,
        colStyleWidths: colStyleWidths,
        headerWidths: headerWidths,
        groupHeaderRows: groupHeaderRows,
        groupHeaderLabels: groupHeaderLabels,
        groupHeaderLevels: groupHeaderLevels,
        groupHeaderColSpans: groupHeaderColSpans,
        groupHeaderCssTexts: groupHeaderCssTexts,
        groupHeaderBackgroundColors: groupHeaderBackgroundColors,
        groupHeaderColors: groupHeaderColors,
        editableRows: editableRows,
        editableCols: editableCols,
        selectedCellRows: selectedCellRows,
        selectedCellCols: selectedCellCols,
        selectedRows: selectedRows,
        selectedColumns: selectedColumns,
        tooltipVisible: tooltip.visible,
        tooltipText: tooltip.text,
        tooltipBlockCssTexts: tooltip.blockCssTexts,
        tooltipLineTexts: tooltip.lineTexts,
        tooltipLineCssTexts: tooltip.lineCssTexts,
        contextMenuVisible: contextMenu.visible,
        contextMenuTexts: contextMenu.texts,
        contextMenuPaths: contextMenu.paths,
        contextMenuEnabled: contextMenu.enabled,
        contextMenuOpenPaths: contextMenu.openPaths,
        contextMenuSubmenuDisplays: contextMenu.submenuDisplays,
        contextMenuSubmenuPositions: contextMenu.submenuPositions,
        contextMenuBackgroundColor: contextMenu.backgroundColor
      };
    }

    Array.prototype.forEach.call(table.querySelectorAll("thead th"), function(th) {
      headerTexts.push(th.textContent || "");
      headerTitles.push(th.title || "");
      headerBackgroundColors.push(window.getComputedStyle(th).backgroundColor || "");
      headerWidths.push(th.getBoundingClientRect().width || 0);
      if (th.classList.contains("selected-column")) selectedColumns.push(Number(th.dataset.col));
    });
    Array.prototype.forEach.call(table.querySelectorAll("colgroup col"), function(col) {
      colStyleWidths.push(col.style.width || "");
    });
    Array.prototype.forEach.call(table.querySelectorAll("tbody tr"), function(row) {
      if (row.classList.contains("selected-row")) {
        var firstCell = row.querySelector("td");
        if (firstCell) selectedRows.push(Number(firstCell.dataset.row));
      }
    });
    Array.prototype.forEach.call(table.querySelectorAll("tbody td"), function(td) {
      var row = Number(td.dataset.row);
      var col = Number(td.dataset.col);
      var computedStyle = window.getComputedStyle(td);
      cellRows.push(row);
      cellCols.push(col);
      cellTexts.push(td.textContent || "");
      cellTitles.push(td.title || "");
      cellClasses.push(td.className || "");
      cellCssTexts.push(td.style.cssText || "");
      cellBackgroundColors.push(computedStyle.backgroundColor || "");
      cellColors.push(computedStyle.color || "");
      if (td.dataset.groupHeader === "true") {
        groupHeaderRows.push(row);
        groupHeaderLabels.push(td.textContent || "");
        groupHeaderLevels.push(Number(td.dataset.groupLevel || 1));
        groupHeaderColSpans.push(Number(td.colSpan || 1));
        groupHeaderCssTexts.push(td.style.cssText || "");
        groupHeaderBackgroundColors.push(computedStyle.backgroundColor || "");
        groupHeaderColors.push(computedStyle.color || "");
      }
      if (td.isContentEditable || td.getAttribute("contenteditable") === "true") {
        editableRows.push(row);
        editableCols.push(col);
      }
      if (td.classList.contains("selected")) {
        selectedCellRows.push(row);
        selectedCellCols.push(col);
      }
      if (td.classList.contains("selected-column") && selectedColumns.indexOf(col) < 0) {
        selectedColumns.push(col);
      }
    });

    return {
      rowCount: table.querySelectorAll("tbody tr").length,
      columnCount: headerTexts.length,
      theme: String(document.body.dataset.theme || "light"),
      tableBackgroundColor: rootStyle ? rootStyle.backgroundColor || "" : "",
      tableTitle: tableTitle,
      headerTexts: headerTexts,
      headerTitles: headerTitles,
      headerBackgroundColors: headerBackgroundColors,
      cellRows: cellRows,
      cellCols: cellCols,
      cellTexts: cellTexts,
      cellTitles: cellTitles,
      cellClasses: cellClasses,
      cellCssTexts: cellCssTexts,
      cellBackgroundColors: cellBackgroundColors,
      cellColors: cellColors,
      colStyleWidths: colStyleWidths,
      headerWidths: headerWidths,
      groupHeaderRows: groupHeaderRows,
      groupHeaderLabels: groupHeaderLabels,
      groupHeaderLevels: groupHeaderLevels,
      groupHeaderColSpans: groupHeaderColSpans,
      groupHeaderCssTexts: groupHeaderCssTexts,
      groupHeaderBackgroundColors: groupHeaderBackgroundColors,
      groupHeaderColors: groupHeaderColors,
      editableRows: editableRows,
      editableCols: editableCols,
      selectedCellRows: selectedCellRows,
      selectedCellCols: selectedCellCols,
      selectedRows: selectedRows,
      selectedColumns: uniqueNumbers(selectedColumns),
      tooltipVisible: tooltip.visible,
      tooltipText: tooltip.text,
      tooltipBlockCssTexts: tooltip.blockCssTexts,
      tooltipLineTexts: tooltip.lineTexts,
      tooltipLineCssTexts: tooltip.lineCssTexts,
      contextMenuVisible: contextMenu.visible,
      contextMenuTexts: contextMenu.texts,
      contextMenuPaths: contextMenu.paths,
      contextMenuEnabled: contextMenu.enabled,
      contextMenuOpenPaths: contextMenu.openPaths,
      contextMenuSubmenuDisplays: contextMenu.submenuDisplays,
      contextMenuSubmenuPositions: contextMenu.submenuPositions,
      contextMenuBackgroundColor: contextMenu.backgroundColor
    };
  }

  function tooltipSnapshot() {
    var visible = !!(tooltipEl && tooltipEl.isConnected && tooltipEl.style.display !== "none");
    var blockCssTexts = [];
    var lineTexts = [];
    var lineCssTexts = [];
    if (tooltipEl && tooltipEl.isConnected) {
      Array.prototype.forEach.call(tooltipEl.children, function(blockDiv) {
        blockCssTexts.push(blockDiv.style.cssText || "");
        Array.prototype.forEach.call(blockDiv.children, function(lineDiv) {
          lineTexts.push(lineDiv.textContent || "");
          lineCssTexts.push(lineDiv.style.cssText || "");
        });
      });
    }
    return {
      visible: visible,
      text: tooltipEl && tooltipEl.isConnected ? tooltipEl.textContent || "" : "",
      blockCssTexts: blockCssTexts,
      lineTexts: lineTexts,
      lineCssTexts: lineCssTexts
    };
  }

  function contextMenuSnapshot() {
    var visible = !!(contextMenuEl && contextMenuEl.isConnected &&
      contextMenuEl.style.display !== "none");
    var texts = [];
    var paths = [];
    var enabled = [];
    var openPaths = [];
    var submenuDisplays = [];
    var submenuPositions = [];
    var backgroundColor = "";
    if (contextMenuEl && contextMenuEl.isConnected) {
      backgroundColor = window.getComputedStyle(contextMenuEl).backgroundColor || "";
      Array.prototype.forEach.call(contextMenuEl.querySelectorAll("li"), function(li) {
        texts.push(firstTextNode(li));
        paths.push(li.dataset.path || "");
        enabled.push(li.dataset.enabled !== "false");
        if (li.classList.contains("open")) openPaths.push(li.dataset.path || "");
        childLists(li).forEach(function(ul) {
          var style = window.getComputedStyle(ul);
          submenuDisplays.push(style.display || "");
          submenuPositions.push(style.position || "");
        });
      });
    }
    return {
      visible: visible,
      texts: texts,
      paths: paths,
      enabled: enabled,
      openPaths: openPaths,
      submenuDisplays: submenuDisplays,
      submenuPositions: submenuPositions,
      backgroundColor: backgroundColor
    };
  }

  function firstTextNode(el) {
    for (var i = 0; i < el.childNodes.length; i++) {
      if (el.childNodes[i].nodeType === Node.TEXT_NODE) return el.childNodes[i].nodeValue || "";
    }
    return "";
  }

  function clickCell(payload) {
    var cell = cellAt(payload.row, payload.col);
    if (!cell) throw new Error("Cell not found");
    cell.dispatchEvent(mouseEvent("click", payload));
  }

  function dragSelectCells(payload) {
    var startCell = cellAt(payload.startRow, payload.startCol);
    var endCell = cellAt(payload.endRow, payload.endCol);
    if (!startCell || !endCell) throw new Error("Cell not found");
    startCell.dispatchEvent(mouseEvent("mousedown", {
      clientX: payload.startClientX || 24,
      clientY: payload.startClientY || 24
    }));
    endCell.dispatchEvent(mouseEvent("mouseenter", {
      clientX: payload.endClientX || 48,
      clientY: payload.endClientY || 48
    }));
    document.dispatchEvent(mouseEvent("mouseup", {
      clientX: payload.endClientX || 48,
      clientY: payload.endClientY || 48
    }));
  }

  function doubleClickCell(payload) {
    var cell = cellAt(payload.row, payload.col);
    if (!cell) throw new Error("Cell not found");
    cell.dispatchEvent(mouseEvent("dblclick", payload));
  }

  function editCell(payload) {
    var cell = cellAt(payload.row, payload.col);
    if (!cell) throw new Error("Cell not found");
    cell.textContent = payload.value == null ? "" : String(payload.value);
    cell.dispatchEvent(new Event("blur", { bubbles: true, cancelable: true }));
  }

  function clickHeader(payload) {
    var header = document.querySelector("thead th[data-col='" + Number(payload.col) + "']");
    if (!header) throw new Error("Header not found");
    header.dispatchEvent(mouseEvent("click", payload));
  }

  function hoverCell(payload, request) {
    var cell = cellAt(payload.row, payload.col);
    if (!cell) throw new Error("Cell not found");
    pendingTooltipProbe = request;
    cell.dispatchEvent(mouseEvent("mouseenter", payload));
  }

  function openContextMenu(payload) {
    var cell = cellAt(payload.row, payload.col);
    if (!cell) throw new Error("Cell not found");
    cell.dispatchEvent(mouseEvent("contextmenu", payload));
  }

  function hoverContextMenuItem(payload) {
    if (!contextMenuEl || contextMenuEl.style.display === "none") {
      openContextMenu(payload);
    }

    var path = String(payload.path || payload.text || "");
    var parts = path.split(" > ");
    var currentPath = "";
    var item = null;
    for (var i = 0; i < parts.length; i++) {
      currentPath = currentPath ? currentPath + " > " + parts[i] : parts[i];
      item = contextMenuItemByPath(currentPath);
      if (!item) throw new Error("Context menu item not found: " + currentPath);
      item.dispatchEvent(mouseEvent("mouseenter", payload));
    }
  }

  function selectContextMenuItem(payload) {
    if (!contextMenuEl || contextMenuEl.style.display === "none") {
      openContextMenu(payload);
    }

    var path = String(payload.path || payload.text || "");
    var item = contextMenuItemByPath(path);
    if (!item) throw new Error("Context menu item not found: " + path);
    if (item.dataset.enabled === "false") throw new Error("Context menu item is disabled: " + path);
    item.dispatchEvent(mouseEvent("click", payload));
  }

  function contextMenuItemByPath(path) {
    if (!contextMenuEl) return null;
    var items = contextMenuEl.querySelectorAll("li");
    for (var i = 0; i < items.length; i++) {
      if ((items[i].dataset.path || "") === path || firstTextNode(items[i]) === path) {
        return items[i];
      }
    }
    return null;
  }

  function cellAt(row, col) {
    if (Number(row) === 0) {
      return document.querySelector("thead th[data-col='" + Number(col) + "']");
    }
    var cell = document.querySelector(
      "tbody td[data-row='" + Number(row) + "'][data-col='" + Number(col) + "']");
    if (cell) return cell;
    return document.querySelector(
      "tbody td[data-row='" + Number(row) + "'][data-group-header='true']");
  }

  function mouseEvent(type, payload) {
    return new MouseEvent(type, {
      bubbles: true,
      cancelable: true,
      clientX: Number(payload.clientX || 24),
      clientY: Number(payload.clientY || 24),
      ctrlKey: !!payload.ctrlKey,
      metaKey: !!payload.metaKey,
      shiftKey: !!payload.shiftKey
    });
  }

  function setup(component) {
    htmlComponent = component;
    document.addEventListener("click", function() {
      hideContextMenu();
    });
    htmlComponent.addEventListener("Render", function(event) {
      render(event.Data || {});
    });
    htmlComponent.addEventListener("SetTooltip", function(event) {
      renderTooltipBlocks((event.Data && event.Data.blocks) || []);
      if (pendingTooltipProbe) {
        var request = pendingTooltipProbe;
        pendingTooltipProbe = null;
        sendProbeResult(request, snapshot());
      }
    });
    htmlComponent.addEventListener("Probe", function(event) {
      handleProbe(event.Data || {});
    });
    send({ event: "BackendReady" });
  }
  </script>
</head>
<body>
  <div id="root" class="table-wrap"></div>
</body>
</html>
